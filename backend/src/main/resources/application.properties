# ==============================================================================
# NexusCall DBMS - JDBC Backend Configuration
# ==============================================================================

server.port=8080

# Primary Configuration: Embedded Database in PostgreSQL Mode
# Allows instant execution without requiring a local PostgreSQL service installation,
# while maintaining 100% PostgreSQL syntax, data types, and JDBC behavior.
spring.datasource.url=jdbc:h2:mem:callcenter_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# Alternative: To connect to an external production PostgreSQL instance, uncomment below:
# spring.datasource.url=jdbc:postgresql://localhost:5432/callcenter_db
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=your_password

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=NexusCallHikariPool
